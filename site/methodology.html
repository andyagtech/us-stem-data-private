<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to /data_sources</title>
<link rel="canonical" href="https://phd-demographics.andy-barr.com/data_sources.html#dataset-catalogue">
<meta name="robots" content="noindex">
<!-- The dataset catalogue lived here from 2026 and the URL was shared, so this
     stays as a redirect rather than becoming a 404. The site had two answers
     to "where does this come from": a hand-written narrative at /data_sources
     with six inbound links, and this generated catalogue with three. They are
     merged on the page with more links, and the catalogue is still generated
     -- it is written between markers by scripts/build_methodology_page.py, so
     the drift that caused the split cannot return through the merge.
     The hash is carried over so a link to a particular section still lands on
     that section: #datasets, #derived and #what-the-data-cannot-answer all
     kept their ids. -->
<meta http-equiv="refresh" content="0; url=/data_sources#dataset-catalogue">
<script>location.replace('/data_sources' + (location.hash || '#dataset-catalogue'));</script>
<link rel="stylesheet" href="/style.css">
<style>
  :root{color-scheme:light dark}
  body{margin:0;padding:48px 20px;background:#fff;color:#111827;
       font:400 16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  @media (prefers-color-scheme:dark){body{background:#0f172a;color:#e2e8f0}}
  .box{max-width:34rem;margin:0 auto}
  a{color:#1d4ed8}
  @media (prefers-color-scheme:dark){a{color:#7dd3fc}}
</style>
  <script id="phd-theme-boot">(function(){try{var t=localStorage.getItem("phd-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <script defer src="/theme.js"></script>
</head>
<body>
<div class="box">
  <h1>This page has moved</h1>
  <p>The dataset catalogue is now a section of
     <a href="/data_sources#dataset-catalogue">Data sources and methodology</a>,
     so the site has one page about where its figures come from instead of two.</p>
  <p><a href="/data_sources#dataset-catalogue">Go there now</a></p>
</div>
</body>
</html>
