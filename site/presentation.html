*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);

}
.deck{height:100vh; height:100dvh; position:relative;}
.slide{
  position:absolute; inset:0; padding:clamp(28px,4.2vw,72px) clamp(24px,5vw,88px) 76px;
  display:none; flex-direction:column; gap:clamp(14px,1.8vh,26px);

  overflow-y:auto;
}
.slide.on{display:flex; opacity:1;}
@media (prefers-reduced-motion:reduce){ .slide{transition:none;} }

.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.68rem; letter-spacing:.13em;

}
.eyebrow .tag{color:var(--nra);}
h1{
  font-family:"Newsreader",Georgia,serif; font-weight:500; font-size:clamp(2.1rem,5.4vw,4.1rem);
  line-height:1.04; letter-spacing:-.018em; margin:0; text-wrap:balance; max-width:19ch;
}
h2{
  font-family:"Newsreader",Georgia,serif; font-weight:500; font-size:clamp(1.6rem,3.3vw,2.65rem);

}
.lede{font-size:clamp(1rem,1.35vw,1.2rem); color:var(--ink2); max-width:62ch; margin:0;}
.lede strong{color:var(--ink); font-weight:600;}
p.note{font-size:.86rem; color:var(--ink3); max-width:70ch; margin:0;}

.cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:clamp(20px,3.4vw,54px); align-items:center; flex:1; min-height:0;}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
@media (max-width:900px){ .cols,.cols.even{grid-template-columns:1fr; align-items:start;} }
.stack{display:flex; flex-direction:column; gap:16px; min-width:0;}

.figure{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:18px 20px 14px; box-shadow:var(--shadow); min-width:0;}

.hero{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:clamp(3rem,8.5vw,6.6rem); line-height:.92; letter-spacing:-.04em; color:var(--nra); font-weight:500;}

.stats{display:flex; gap:clamp(18px,3vw,42px); flex-wrap:wrap;}

.rail button.cur{background:var(--nra);}
.rail button:focus-visible{outline:2px solid var(--nra); outline-offset:3px;}

.hint{font-size:.7rem; color:var(--ink3); letter-spacing:.04em;}

   mouse user saw slide one of twelve and took it for the whole thing. */
.step{font:600 .8rem/1 inherit; font-family:inherit; padding:9px 14px; border-radius:6px;
  border:1px solid var(--rule2); background:var(--panel); color:var(--ink); cursor:pointer;}
.step.next{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.step:hover{border-color:var(--nra);}
.step:disabled{opacity:.35; cursor:default;}
.step:focus-visible{outline:2px solid var(--nra); outline-offset:2px;}
/* A 3px target is nearly impossible to click; keep the 3px look, widen the hit area. */
.rail button{height:14px !important; background:linear-gradient(var(--rule2),var(--rule2)) center/100% 3px no-repeat !important;}
.rail button.done{background:linear-gradient(var(--ink3),var(--ink3)) center/100% 3px no-repeat !important;}
.rail button.cur{background:linear-gradient(var(--nra),var(--nra)) center/100% 3px no-repeat !important;}

/* ---------- chart builders (hand-rolled SVG; no library, CSP-safe) ---------- */

function lineChart(series, opts){
  // series: [{name, color, points:{year:value}, dash, width}]
  const o = Object.assign({w:640,h:300,min:0,max:100,pad:{t:14,r:52,b:26,l:34},ticks:[0,25,50,75,100],label:true}, opts||{});
  const {w,h,pad} = o;
  const xs = o.years || YRS;
  const X = y => pad.l + (xs.indexOf(y))*(w-pad.l-pad.r)/(xs.length-1);
  const Y = v => pad.t + (1-(v-o.min)/(o.max-o.min))*(h-pad.t-pad.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||'line chart'}">`;
  o.ticks.forEach(t=>{
    s += `<line class="gl" x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`;
    s += `<text class="axl" x="${pad.l-7}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${t}${o.pct===false?'':'%'}</text>`;
  });
  xs.forEach((y,i)=>{ if(i%o.xstep===0 || i===xs.length-1)
    s += `<text class="axl" x="${X(y).toFixed(1)}" y="${h-pad.b+15}" text-anchor="middle">${String(y).slice(2)}</text>`; });
  series.forEach(se=>{
    const pts = xs.filter(y=>se.points[y]!=null).map(y=>[X(y),Y(se.points[y])]);
    if(!pts.length) return;
    if(se.area){
      const d = `M${pts[0][0].toFixed(1)},${Y(o.min).toFixed(1)} ` + pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ` L${pts[pts.length-1][0].toFixed(1)},${Y(o.min).toFixed(1)}Z`;
      s += `<path d="${d}" fill="${se.area}"/>`;
    }
    const d = 'M' + pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('L');
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width||2}" stroke-linejoin="round" stroke-linecap="round"${se.dash?` stroke-dasharray="${se.dash}"`:''}/>`;
    if(se.dot!==false){
      const last = pts[pts.length-1];
      s += `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${se.color}" stroke="var(--panel)" stroke-width="2"/>`;
    }
    if(o.label && se.label!==false){
      const last = pts[pts.length-1];
      s += `<text class="dl" x="${(last[0]+9).toFixed(1)}" y="${(last[1]+4).toFixed(1)}" fill="${se.color}">${se.tip}</text>`;
    }
  });
  return s+'</svg>';
}

function sparkline(points, w, h, ref){
  const xs = Object.keys(points).map(Number).sort((a,b)=>a-b);
  const X = y => 2 + (xs.indexOf(y))*(w-4)/Math.max(1,(xs.length-1));
  const Y = v => 2 + (1-v/100)*(h-4);
  const pts = xs.map(y=>[X(y),Y(points[y])]);
  const area = `M${pts[0][0].toFixed(1)},${(h-2).toFixed(1)} ` + pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ` L${pts[pts.length-1][0].toFixed(1)},${(h-2).toFixed(1)}Z`;
  const line = 'M' + pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('L');
  let s = `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true" style="width:100%;height:${h}px">`;
  if(ref!=null) s += `<line x1="2" x2="${w-2}" y1="${Y(ref).toFixed(1)}" y2="${Y(ref).toFixed(1)}" stroke="var(--base)" stroke-width="1" stroke-dasharray="3 3"/>`;
  s += `<path d="${area}" fill="var(--fill)"/><path d="${line}" fill="none" stroke="var(--nra)" stroke-width="1.8" stroke-linejoin="round"/>`;
  s += `<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.6" fill="var(--nra)"/></svg>`;
  return s;
}

function barChart(points, opts){
  const o = Object.assign({w:640,h:300,pad:{t:14,r:16,b:26,l:40},max:null,ticks:4}, opts||{});
  const {w,h,pad}=o;
  const xs = Object.keys(points).map(Number).sort((a,b)=>a-b);
  const max = o.max || Math.ceil(Math.max(...xs.map(y=>points[y]))/50)*50;
  const bw = (w-pad.l-pad.r)/xs.length;
  const Y = v => pad.t + (1-v/max)*(h-pad.t-pad.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||'bar chart'}">`;
  for(let i=0;i<=o.ticks;i++){
    const v = max*i/o.ticks;
    s += `<line class="gl" x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`;
    s += `<text class="axl" x="${pad.l-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
  }
  xs.forEach((y,i)=>{
    const x = pad.l + i*bw + 2, bh = Math.max(1, Y(0)-Y(points[y]));
    s += `<rect x="${x.toFixed(1)}" y="${Y(points[y]).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(--nra)"/>`;
    if(i%3===0||i===xs.length-1) s += `<text class="axl" x="${(x+(bw-4)/2).toFixed(1)}" y="${h-pad.b+15}" text-anchor="middle">${String(y).slice(2)}</text>`;
  });
  return s+'</svg>';
}

/* ---------- render & navigate ---------- */
const SLUGS = ['public-cost','overview','national-flat','concentration','by-field']
  .concat(featured.filter(n=>D.cases.some(c=>c.institution===n))
                  .map(n=>'case-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')))
  .concat(['persistence','method']);

const deck = document.getElementById('deck');
deck.innerHTML = S.map((h,i)=>`<section class="slide" id="${SLUGS[i]||('slide-'+(i+1))}" aria-hidden="true">${h}</section>`).join('');
const rail = document.getElementById('rail');
rail.innerHTML = S.map((_,i)=>`<button type="button" aria-label="Go to slide ${i+1}"></button>`).join('');
const railBtns = [...rail.children];
const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
const slides = [...deck.children];
let cur = 0;

function slugOf(i){ return SLUGS[i] || ('slide-'+(i+1)); }
function indexOfHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/,'')).trim();
  if(!h) return 0;
  const bySlug = SLUGS.indexOf(h);
  if(bySlug >= 0) return bySlug;
  const m = h.match(/^slide-(\d+)$/);
  if(m) return Math.max(0, Math.min(S.length-1, parseInt(m[1],10)-1));
  return 0;
}
function go(n, push){
  cur = Math.max(0, Math.min(S.length-1, n));
  const want = '#'+slugOf(cur);
  if(push !== false && location.hash !== want){
    history[location.hash ? 'pushState' : 'replaceState'](null, '', want);
  }
  slides.forEach((s,i)=>{ s.classList.toggle('on', i===cur); s.setAttribute('aria-hidden', i===cur?'false':'true'); });
  railBtns.forEach((b,i)=>{ b.className = i===cur?'cur':(i<cur?'done':''); });
  document.getElementById('count').textContent = String(cur+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  slides[cur].scrollTop = 0;
  {
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === S.length-1;
    nextBtn.textContent = cur === S.length-1 ? 'End' : 'Next slide →';
  }
}
railBtns.forEach((b,i)=>b.addEventListener('click',()=>go(i)));
prevBtn.addEventListener('click', ()=>go(cur-1));
nextBtn.addEventListener('click', ()=>go(cur+1));
addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); go(cur+1); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ e.preventDefault(); go(0); }
  else if(e.key==='End'){ e.preventDefault(); go(S.length-1); }
});
let tx=0;
addEventListener('touchstart', e=>{ tx=e.changedTouches[0].clientX; }, {passive:true});
addEventListener('touchend', e=>{ const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>60) go(cur + (d<0?1:-1)); }, {passive:true});
addEventListener('hashchange', ()=>{ const i=indexOfHash(); if(i!==cur) go(i,false); });
go(indexOfHash(), false);
