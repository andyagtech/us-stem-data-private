AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PhD Demographics AI Chat Assistant
Parameters:
  Environment:
    Type: String
    Default: prod
  AllowedOrigin:
    Type: String
    Default: https://phd-demographics.andy-barr.com
  ChatProvider:
    Type: String
    Default: openai
  ChatModel:
    Type: String
    Default: gpt-4o
Resources:
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: phd-chat-ratelimit-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: phd-chat-${Environment}
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      CodeUri: ChatFunction
      Environment:
        Variables:
          RATE_LIMIT_TABLE:
            Ref: RateLimitTable
          ALLOWED_ORIGIN:
            Ref: AllowedOrigin
          CHAT_PROVIDER:
            Ref: ChatProvider
          CHAT_MODEL:
            Ref: ChatModel
          OPENAI_API_KEY_SSM: /cms-pipeline/openai-api-key
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          - bedrock:InvokeModelWithResponseStream
          Resource: '*'
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RateLimitTable
      - Statement:
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
          - Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/phd-demographics/*
          - Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cms-pipeline/*
    Metadata:
      SamResourceId: ChatFunction
  ChatUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Ref: ChatFunction
      AuthType: NONE
      Cors:
        AllowCredentials: false
        AllowHeaders:
        - content-type
        AllowMethods:
        - POST
        - OPTIONS
        AllowOrigins:
        - Ref: AllowedOrigin
  ChatUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ChatFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
Outputs:
  ChatEndpoint:
    Value:
      Fn::GetAtt:
      - ChatUrl
      - FunctionUrl
  RateLimitTable:
    Value:
      Ref: RateLimitTable
