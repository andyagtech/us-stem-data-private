AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PhD Demographics AI Chat Assistant
Parameters:
  Environment:
    Type: String
    Default: prod
  AllowedOrigin:
    Type: String
    Default: https://phd-demographics.andy-barr.com
  ChatProvider:
    Type: String
    Default: openai
  ChatModel:
    Type: String
    Default: gpt-4o
  ChatLogsTable:
    Type: String
    Default: phd-chat-logs
    Description: "Existing DynamoDB table (pk=day, sk=timestamp#ip, TTL on `ttl`)\
      \ that chat-admin.html reads. It is NOT created by this stack \u2014 it predates\
      \ it \u2014 so it is referenced by name. Until this parameter was wired into\
      \ the function environment, _log_chat() short-circuited and every chat interaction\
      \ was silently discarded."
Resources:
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: phd-chat-ratelimit-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  ChatCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: phd-chat-cache-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: cache_key
        AttributeType: S
      - AttributeName: bucket
        AttributeType: S
      KeySchema:
      - AttributeName: cache_key
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: bucket-index
        KeySchema:
        - AttributeName: bucket
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: phd-chat-${Environment}
      Runtime: python3.12
      Handler: index.handler
      Timeout: 45
      MemorySize: 1024
      CodeUri: ChatFunction
      Environment:
        Variables:
          RATE_LIMIT_TABLE:
            Ref: RateLimitTable
          ALLOWED_ORIGIN:
            Ref: AllowedOrigin
          CHAT_PROVIDER:
            Ref: ChatProvider
          CHAT_MODEL:
            Ref: ChatModel
          CHAT_CACHE_TABLE:
            Ref: ChatCacheTable
          CHAT_LOGS_TABLE:
            Ref: ChatLogsTable
          OPENAI_API_KEY_SSM: /cms-pipeline/openai-api-key
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RateLimitTable
      - DynamoDBWritePolicy:
          TableName:
            Ref: ChatLogsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ChatCacheTable
      - Statement:
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
          - Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/phd-demographics/*
          - Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cms-pipeline/*
    Metadata:
      SamResourceId: ChatFunction
  ChatUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Fn::GetAtt:
        - ChatFunction
        - Arn
      AuthType: NONE
      Cors:
        AllowCredentials: false
        AllowHeaders:
        - content-type
        AllowMethods:
        - POST
        ExposeHeaders:
        - retry-after
        AllowOrigins:
        - Ref: AllowedOrigin
  ChatUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ChatFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
Outputs:
  ChatEndpoint:
    Value:
      Fn::GetAtt:
      - ChatUrl
      - FunctionUrl
  RateLimitTable:
    Value:
      Ref: RateLimitTable
  ChatLogsTable:
    Value:
      Ref: ChatLogsTable
