AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PhD Demographics AI Chat Assistant

Parameters:
  Environment:
    Type: String
    Default: prod
  AllowedOrigin:
    Type: String
    Default: "https://phd-demographics.andy-barr.com"
  ChatProvider:
    Type: String
    Default: openai
  ChatModel:
    Type: String
    Default: gpt-4o
  ChatLogsTable:
    Type: String
    Default: "phd-chat-logs"
  # The global spend ceiling. Per-IP limiting caps one visitor, not the bill;
  # these cap the day. Parameters rather than constants so they can be tuned
  # from the console without a code deploy, which is what you want at 2am.
  DailySoftCap:
    Type: Number
    Default: 4000
    Description: Past this many requests in a UTC day, serve cache only.
  DailyHardCap:
    Type: Number
    Default: 6000
    Description: Past this, refuse outright.
  LimiterFailsOpenUntil:
    Type: Number
    Default: 20
    Description: Consecutive rate-limiter errors tolerated before failing closed.
    Description: >-
      Existing DynamoDB table (pk=day, sk=timestamp#ip, TTL on `ttl`) that
      chat-admin.html reads. It is NOT created by this stack — it predates it —
      so it is referenced by name. Until this parameter was wired into the
      function environment, _log_chat() short-circuited and every chat
      interaction was silently discarded.

Resources:
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "phd-chat-ratelimit-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ChatCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "phd-chat-cache-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
        - AttributeName: bucket
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      GlobalSecondaryIndexes:
        # cache.py queries this to gather semantic candidates within one
        # data version and page context, rather than scanning the table.
        - IndexName: bucket-index
          KeySchema:
            - AttributeName: bucket
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "phd-chat-${Environment}"
      Runtime: python3.12
      Handler: index.handler
      # Data tools parse a 260k-row gz index and can take up to 4 model rounds.
      # More memory buys proportionally more CPU, which is what makes the
      # cold-start parse cheap.
      Timeout: 45
      MemorySize: 1024
      CodeUri: lambda/
      Environment:
        Variables:
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          CHAT_PROVIDER: !Ref ChatProvider
          CHAT_MODEL: !Ref ChatModel
          CHAT_CACHE_TABLE: !Ref ChatCacheTable
          CHAT_LOGS_TABLE: !Ref ChatLogsTable
          OPENAI_API_KEY_SSM: "/cms-pipeline/openai-api-key"
          DAILY_SOFT_CAP: !Ref DailySoftCap
          DAILY_HARD_CAP: !Ref DailyHardCap
          LIMITER_FAILS_OPEN_UNTIL: !Ref LimiterFailsOpenUntil
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
        - DynamoDBWritePolicy:
            TableName: !Ref ChatLogsTable
        # Crud rather than Write: the cache is read on every turn and written
        # on a miss, and the semantic path Querys the bucket-index GSI.
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatCacheTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/phd-demographics/*"
                - !Sub "arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cms-pipeline/*"

  ChatUrl:
    Type: AWS::Lambda::Url
    Properties:
      # !Ref on a serverless function returns its NAME; AWS::Lambda::Url
      # requires an ARN, and CloudFormation's early property validation
      # rejects the changeset outright. This is why the template had
      # never deployed.
      TargetFunctionArn: !GetAtt ChatFunction.Arn
      AuthType: NONE
      Cors:
        AllowCredentials: false
        AllowHeaders: [content-type]
        # OPTIONS is not valid here -- Lambda Function URLs answer preflight
        # themselves, and listing it fails CloudFormation early property
        # validation. Valid: GET PUT HEAD POST PATCH DELETE *
        AllowMethods: [POST]
        # The widget reads Retry-After off a 429 to run its countdown; a
        # cross-origin response header is invisible to JS unless it is exposed.
        ExposeHeaders: [retry-after]
        AllowOrigins:
          - !Ref AllowedOrigin

  ChatUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  ChatEndpoint:
    Value: !GetAtt ChatUrl.FunctionUrl
  RateLimitTable:
    Value: !Ref RateLimitTable
  ChatLogsTable:
    Value: !Ref ChatLogsTable
